name: stock_managament_admin
version: 1.0.0+1
publish_to: none
description: Kümüş Stock Admin web panel for inventory, orders, purchases, and reporting.
environment:
  # flutter: ^3.24.0
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  # UI and state
  cupertino_icons: ^1.0.6         # iOS-style icons for Cupertino widgets

  # STATE MANAGEMENT & UTILITIES
  get: ^4.6.6                      # GetX for state management, routing, and DI
  kartal: ^5.0.0                 # Handy extension methods and utilities
  intl: ^0.19.0                   # Internationalization: date, currency, etc.

  # Storage and file operations
  shared_preferences: ^2.3.2     # Key-value local storage (wasm-compatible; replaced get_storage)
  file_saver:                    # Save files to disk (also for web)
  excel: ^2.0.5                  # Read/write Excel files
  archive: ^3.6.1                # Patch the generated XLSX zip (native Excel charts)

  # WEB SUPPORT
  image_picker: ^1.2.3           # Image picking (web impl is wasm-compatible; replaced image_picker_web)

  # UI COMPONENTS & ANIMATIONS
  hugeicons: ^1.1.7               # Hugeicons stroke-rounded icon set
  lottie: ^3.1.0                 # Render animations from Lottie JSON files
  fl_chart: ^0.68.0              # Draw line, bar, pie, and other charts
  flutter_screenutil:            # Adapt UI to different screen sizes (responsive)
  cached_network_image: ^3.4.1
  http_parser:

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter



flutter:
  assets:
    - assets/fonts/
    - assets/lottie/
    - assets/image/

  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 700
        - asset: assets/fonts/Gilroy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Gilroy-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gilroy-Regular.ttf
          weight: 400
    - family: NormsPro
      fonts:
        - asset: assets/fonts/NormsProBold.otf
          weight: 700
        - asset: assets/fonts/NormsProMedium.otf
          weight: 500
        - asset: assets/fonts/NormsProRegular.otf
          weight: 400
        - asset: assets/fonts/NormsProLight.otf
          weight: 300
  uses-material-design: true
  generate: true
